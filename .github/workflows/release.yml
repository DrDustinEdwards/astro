name: Release

# A release is the merge of a package's version bump. For each package under packages/, in
# dependency order (enarratio-astro, then enarratio-emdash), when its package.json version on main
# has no <package>@<version> tag yet, the job tags that commit, publishes a GitHub release with the
# version's CHANGELOG section, and stages the package on npm unless npm already has that version (a
# first version is published by hand). A version tagged earlier whose stage npm refused is staged again, if its package is unchanged
# since the tag. A version bump that merged while another run was going can be left without a run (a concurrency group keeps
# only one waiting run and cancels an older pending one, whatever cancel-in-progress says), so each run first tags and
# releases, on its own commit, every version bump of a package since its fifth newest tag that has no tag yet, oldest first
# (a catch-up: GitHub release only, nothing is staged on npm for a version that a later one superseded, and no tag is ever
# moved or replaced). Run it by hand (Actions > Release > Run workflow) for a
# version that merged untagged.
#
# Tagging and staging are one job: a tag made with the workflow's token starts no other workflow
# (GitHub's rule against loops), and npm accepts the publish only from this file.
#
# Nothing goes live here: the job runs `npm stage publish`, and the version stays hidden until a
# maintainer approves it with 2FA on npmjs.com (Staged Packages tab) or with `npm stage approve`.
# Steps for a release: docs/releasing.md.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored anywhere. npm accepts the
# publish only from this file, by name, as configured on each package's npm settings page, so
# renaming this file breaks releases until that setting is changed too. Provenance is generated
# automatically for a trusted publish from a public repository; it is also set explicitly below.
# npm's documentation: https://docs.npmjs.com/trusted-publishers and
# https://docs.npmjs.com/staged-publishing (npm CLI 11.15.0 or later, Node.js 22.14.0 or later).

on:
  push:
    branches: [main]
    paths: ["packages/*/package.json"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release and stage changed packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # Lets the job request the OIDC token that npm exchanges for a short-lived publish token, and
      # the one attest-build-provenance signs each staged tarball's attestation with.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The catch-up reads each package.json's version history and its tags.
          fetch-depth: 0
          fetch-tags: true
      # No dependency cache in a release build (npm's trusted publishing guide).
      # v7, as Enarratio's release: setup-node v4 exports NODE_AUTH_TOKEN as a placeholder
      # (XXXXX-XXXXX-XXXXX-XXXXX) when no token is given, and the .npmrc it writes for registry-url sends it
      # in place of the trusted-publishing token, so npm answered E401 to every stage (0.2.0, 0.2.1, 0.3.0).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the npm CLI that supports staged publishing
        run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm run check
      # Catch-up: a version bump that merged without a run of its own (see the top of this file). Only versions older than
      # the one at HEAD are handled here; the version at HEAD is tagged and staged by the next step, as always.
      - name: Tag and release skipped versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          for dir in packages/enarratio-astro packages/enarratio-emdash; do
            name="$(node -p "require('./$dir/package.json').name")"
            head_version="$(node -p "require('./$dir/package.json').version")"
            tags="$RUNNER_TEMP/tags-$name.txt"
            git tag -l "$name@*" | sort -V > "$tags"
            # The bumps since the fifth newest tag; a package with no tag yet is released by hand first.
            newest="$(tail -n 5 "$tags" | head -n 1)"
            [ -n "$newest" ] || continue
            anchor="$(git rev-parse "$newest^{commit}")"
            if ! git merge-base --is-ancestor "$anchor" HEAD; then
              echo "::warning::$newest is not on main; skipping the catch-up for $name."
              continue
            fi
            prev="$(git show "$anchor:$dir/package.json" | jq -r .version)"
            while read -r -u 3 sha; do
              v="$(git show "$sha:$dir/package.json" 2>/dev/null | jq -r .version 2>/dev/null || true)"
              printf '%s' "$v" | grep -Eq "$semver" || continue
              [ "$v" = "$prev" ] && continue
              prev="$v"
              [ "$v" = "$head_version" ] && continue
              grep -qx "$name@$v" "$tags" && continue
              tag="$name@$v"
              echo "$tag was never tagged; releasing it on $sha."
              git show "$sha:$dir/CHANGELOG.md" 2>/dev/null | awk -v v="$v" '
                index($0, "## [" v "]") == 1 { on = 1; next }
                on && /^## \[/ { exit }
                on { print }
              ' > notes.md || true
              if [ -s notes.md ]; then
                gh release create "$tag" --target "$sha" --latest=false --title "$tag" --notes-file notes.md
              else
                gh release create "$tag" --target "$sha" --latest=false --title "$tag" --generate-notes
              fi
            done 3< <(git rev-list --first-parent --reverse "$anchor..HEAD" -- "$dir/package.json")
          done
      - name: Tag, release and stage
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          for dir in packages/enarratio-astro packages/enarratio-emdash; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            tag="$name@$version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              if npm view "$tag" version >/dev/null 2>&1; then
                echo "$tag already exists and is on npm; nothing to release."
                continue
              fi
              # Tagged but never on npm (a refused stage): stage it again, if the package is unchanged since the tag.
              git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
              if ! git diff --quiet "$tag" HEAD -- "$dir"; then
                echo "::error::$tag is tagged but not on npm, and $dir changed since the tag. Bump the version to release it."
                exit 1
              fi
              echo "$tag is tagged but not on npm; staging it again."
            else
              # The version's own CHANGELOG section, from its heading to the next one.
              awk -v v="$version" '
                index($0, "## [" v "]") == 1 { on = 1; next }
                on && /^## \[/ { exit }
                on { print }
              ' "$dir/CHANGELOG.md" > notes.md
              if [ ! -s notes.md ]; then
                echo "::error::$dir/CHANGELOG.md has no section headed ## [$version]. Add it before bumping the version."
                exit 1
              fi
              gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
            fi
            if npm view "$tag" version >/dev/null 2>&1; then
              echo "npm already has $tag (published by hand); not staging it."
              continue
            fi
            # The dist-tag is fixed once staged, so it is passed explicitly from publishConfig.
            dist_tag="$(node -p "require('./$dir/package.json').publishConfig.tag")"
            (cd "$dir" && npm stage publish --tag "$dist_tag")
            # npm pack writes into an existing folder only.
            mkdir -p "$RUNNER_TEMP/pack"
            (cd "$dir" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack")
            echo "packed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### $tag staged on npm, not yet live"
              echo
              echo "Sign in at https://www.npmjs.com, open the Staged Packages tab and approve it, or run"
              echo "\`npm stage list $name\` and \`npm stage approve <stage-id>\`. Steps: docs/releasing.md."
            } >> "$GITHUB_STEP_SUMMARY"
          done
      # A GitHub artifact attestation for each staged tarball (checklist C7), beside npm's own
      # provenance: `gh attestation verify <name>-<version>.tgz --repo DrDustinEdwards/astro` checks it.
      - if: steps.stage.outputs.packed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pack/*.tgz
