name: CI

on:
  # No push to main: the merge was checked as its pull request, and nothing deploys from main (release.yml runs
  # `npm run check` itself before it stages). devkit README, "No second run on main".
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Node 24, which sites run, and 26, the .nvmrc line. Astro needs 22.23.4 or later.
    name: Typecheck, lint, tests, package (Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - run: npm test
      - run: npm pack --dry-run --workspaces

  site:
    # The packed tarballs in a real EmDash site: install them as a site would, build, serve, and
    # read the EmDash post, the component page and the Markdown page. The only check that catches a
    # missing export or a .astro file left out of a package (EmDash's "Distributing native plugins").
    name: Build and serve the demo site from the packed packages
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack --workspaces --pack-destination demo
      - run: npm ci
        working-directory: demo
      - run: npm install --no-save ./enarratio-astro-*.tgz ./enarratio-emdash-*.tgz
        working-directory: demo
      - run: npm run setup
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - run: node check.mjs
        working-directory: demo
