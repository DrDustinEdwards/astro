name: ai-author

# Devkit's gate that refuses an AI attribution trailer on a commit a push or pull request adds
# (and a commit authored or committed as Claude on a pull request): portfolio rule, no AI
# attribution on any commit. The bin comes from the devkit tag passed below, since this repo does
# not install devkit. The workflow is pinned by full sha, which devkit's scripts/check-callers.mjs
# requires.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@9458af9d1521d77ed5bca0f7454c07eea3869221 # v0.11.0
    with:
      devkit: DrDustinEdwards/devkit#v0.11.0
